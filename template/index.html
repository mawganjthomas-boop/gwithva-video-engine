<script>
/* ===================== helpers ===================== */
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));

const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

/* shrink a single-line element's font until it fits its box */
function fit(e,minPx){const cs=getComputedStyle(e);let fs=parseFloat(cs.fontSize);e.style.whiteSpace='nowrap';
  while(e.scrollWidth>e.clientWidth+1&&fs>minPx){fs-=2;e.style.fontSize=fs+'px';}
  if(e.scrollWidth>e.clientWidth+1)PROBLEMS.push('Text too long: '+e.textContent.slice(0,60));return fs;}
/* multi-line block: shrink until height fits */
function fitH(e,maxH,minPx){let fs=parseFloat(getComputedStyle(e).fontSize);
  while(e.scrollHeight>maxH&&fs>minPx){fs-=2;e.style.fontSize=fs+'px';}

 update(o,t,s,dur,L){const r=eio(seg(t,0,.45));L.style.clipPath=`inset(${(1-r)*100}% 0 0 0)`;draw(o.logo,t,.3,.95);
  const w=eo(seg(t,.5,.9));o.word.style.opacity=w;o.word.style.transform=`translateY(${(1-w)*36}px)`;o.rule.style.transform=`scaleX(${eio(seg(t,.8,1.15))})`;
  const c=seg(t,.95,1.35);o.btn.style.opacity=cl(c*2);o.btn.style.transform=`translateY(${(1-eo(c))*40}px) scale(${lerp(.92,1,eb(c))})`;
  const u=eb(seg(t,1.2,1.55));o.stores.style.opacity=cl(u*2);o.stores.style.transform=`translateY(${(1-u)*40}px)`;o.url.style.opacity=.7*eo(seg(t,1.5,1.8));
  const pulse=seg(t,1.7,2.2);o.btn.style.boxShadow=`0 20px 44px rgba(203,106,66,.35),0 0 0 ${pulse*26}px rgba(203,106,66,${.3*(1-pulse)})`;}};

/* ===================== timeline ===================== */
let TL=[],TOTAL=0;
function init(spec){
 const stage=document.getElementById('stage');stage.innerHTML='';TL=[];CUES.length=0;PROBLEMS.length=0;
 // group consecutive app scenes
 const seq=[];spec.scenes.forEach(s=>{if(s.type==='app'){const last=seq[seq.length-1];if(last&&last.type==='appgroup')last.items.push(s);else seq.push({type:'appgroup',items:[s]});}else seq.push(s);});
 let t=0;
 seq.forEach((s,i)=>{let dur;
  if(s.type==='appgroup'){s.starts=[];let lt=.35;s.items.forEach((it,k)=>{s.starts.push(lt);lt+=SCREENS[it.screen].dur;});dur=lt+.1;}
  else dur=LIB[s.type].dur(s);
  const start=i===0?0:t-OV;const L=el('div','layer',stage);L.style.zIndex=i+1;
  const o=LIB[s.type].build(L,s);TL.push({s,L,o,start,dur,lib:LIB[s.type]});t=start+dur;});
 TOTAL=+(t+.4).toFixed(2);
 return document.fonts.ready.then(()=>{
  TL.forEach(x=>{x.L.style.display='block';x.lib.fitAll&&x.lib.fitAll(x.o);x.L.style.display='none';});
  TL.forEach(x=>{const st=x.start;if(x.s.type==='appgroup'){cue(st,'whoosh');x.s.starts.forEach((s0,k)=>{if(k)cue(st+s0-OV,'swipe');const S=SCREENS[x.s.items[k].screen];if(S.cues)S.cues(st+s0,x.o.screens[k].so);});}
   else{if(x.s.type==='pileup')x.o.kinds=(x.s.notifications||[]).map(n=>n.kind);if(x.lib.cues)x.lib.cues(st,x.o);}});
  CUES.sort((a,b)=>a.t-b.t);
  return {total:TOTAL,cues:CUES,problems:PROBLEMS,timeline:TL.map(x=>({type:x.s.type,start:+x.start.toFixed(2),dur:+x.dur.toFixed(2),screens:x.s.type==='appgroup'?x.s.items.map((it,k)=>({screen:it.screen,start:+(x.start+x.s.starts[k]).toFixed(2),dur:SCREENS[it.screen].dur})):undefined}))};});
}
function setTime(t){TL.forEach((x,i)=>{const lt=t-x.start,on=lt>=0&&lt<x.dur+.05&&!(TL[i+1]&&t>=TL[i+1].start+OV+.02&&!TL[i+1].lib.transparent&&TL[i+1].s.type!=='payoff'&&TL[i+1].s.type!=='cta');
  x.L.style.display=on||(i===TL.length-1&&lt>=0)?'block':'none';if(x.L.style.display==='none')return;
  // generic entry for non-first layers that don't animate their own entry
  const own={reveal:1,payoff:1,cta:1};if(i>0&&!own[x.s.type]){const e=eio(seg(lt,0,OV));x.L.style.transform=`translateY(${(1-e)*1920}px)`;}
  const nx=TL[i+1];if(nx&&t>nx.start&&!own[nx.s.type]){const e=eio(seg(t,nx.start,nx.start+OV));x.L.style.transform=`translateY(${-e*500}px)`;x.L.style.opacity=1-e;}else if(!nx||t<=nx.start){x.L.style.opacity=1;}
  x.lib.update(x.o,lt,x.s,x.dur,x.L);});}
window.init=init;window.setTime=setTime;
</script></body></html>
