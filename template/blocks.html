<!doctype html>
<html><head><meta charset="utf-8">
<!-- Gwithva video engine v2: building blocks.
     A storyboard is a list of scenes; each scene is a list of blocks (text, cartoon characters, props,
     speech bubbles, notifications, real app screens, photos, clips, checklists, counters, logo, end card).
     Any order, any length. Only the brand is locked here: colours, fonts, logo, character style.
     Everything is drawn in a 1080 x 1920 frame; 4:5 and 1:1 versions are centre crops made by render.py,
     so keep important things inside the safe zone (x 6-86%, y 14-78%). -->
<style>

@font-face{font-family:Nun;src:url(assets/Nunito.ttf);font-weight:200 1000}
:root{--teal:#004355;--app:#0d3b4c;--cream:#F4F1EA;--terra:#CB6A42;--peach:#EDA57F;--ink:#12313b;--muted:#6b8790}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream)}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--cream);font-family:Nun,sans-serif}
.scene{position:absolute;inset:0;overflow:hidden;display:none}
.cam{position:absolute;inset:0;transform-origin:50% 50%}
.abs{position:absolute}
.blk{position:absolute;transform-origin:50% 50%}
.tx{text-align:center;white-space:pre-line}
.headline{font-family:Play,serif;font-weight:800;font-size:104px;line-height:1.06;letter-spacing:-.01em}
.big{font-weight:1000;font-size:122px;line-height:1.02}
.body{font-weight:800;font-size:54px;line-height:1.2}
.kicker{font-weight:1000;font-size:38px;letter-spacing:.12em;text-transform:uppercase}
.label{font-weight:900;font-size:42px;padding:14px 34px;border-radius:999px;display:inline-block}
.number{font-family:Play,serif;font-weight:900;font-size:300px;line-height:1}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .04em .12em}
.w>span{display:inline-block}
.bub{position:absolute;background:#fff;border:7px solid var(--teal);border-radius:46px;padding:26px 34px;font-weight:900;font-size:48px;line-height:1.18;color:var(--teal);text-align:center;box-shadow:0 14px 0 rgba(0,67,85,.12)}
.bub.think{border-style:dashed}
.bub.text{background:var(--app);color:#fff;border-color:var(--app);border-radius:36px;font-weight:700;font-size:44px;text-align:left}
.nt{position:absolute;width:100%;background:rgba(255,255,255,.97);border-radius:30px;box-shadow:0 22px 50px rgba(0,30,40,.20);padding:24px 28px 26px 112px;text-align:left}
.nt .ic{position:absolute;left:26px;top:26px;width:66px;height:66px;border-radius:17px;display:flex;align-items:center;justify-content:center}
.nt .ttl{font-weight:900;font-size:28px;color:#5a6f76;display:flex;justify-content:space-between}
.nt .ttl i{font-style:normal;font-weight:700;color:#9aa8ac}
.nt .bd{font-weight:800;font-size:34px;color:var(--ink);line-height:1.2;margin-top:4px}
.ck{display:flex;align-items:center;gap:30px;font-weight:900;font-size:56px;color:var(--teal);margin:22px 0;text-align:left}
.ck .bx{flex:0 0 78px;height:78px;border-radius:20px;border:7px solid var(--teal);background:#fff;position:relative}
.cta{width:780px;height:132px;border-radius:66px;background:var(--terra);color:#fff;font-weight:900;font-size:48px;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 44px rgba(203,106,66,.35);white-space:nowrap;padding:0 30px}
.phone{position:absolute;border-radius:70px;background:#10252c;padding:22px;box-shadow:0 40px 90px rgba(0,40,52,.35)}
.phone .in{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:var(--cream)}
.card{position:absolute;border-radius:40px;overflow:hidden;box-shadow:0 30px 70px rgba(0,40,52,.28);background:#fff}
.media{position:absolute;left:0;top:0;transform-origin:0 0;display:block}
#caps{position:absolute;left:110px;width:820px;top:1290px;font-family:Nun,sans-serif;text-align:center;z-index:9000;pointer-events:none}
#caps span{display:inline;background:rgba(0,49,63,.92);color:#fff;font-weight:900;font-size:54px;line-height:1.5;padding:6px 18px;border-radius:14px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#caps span b{color:var(--peach);font-weight:1000}
#grain{position:absolute;inset:0;z-index:9500;pointer-events:none;opacity:.05;mix-blend-mode:multiply}
#wipe{position:absolute;inset:0;z-index:9400;display:none}
</style></head>
