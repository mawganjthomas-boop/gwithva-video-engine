name: Render Gwithva video

# Make.com starts this (repository_dispatch, event "render") with:
#   client_payload.page_id   - the Notion Approval Queue page
#   client_payload.callback  - Make webhook to report back to
#   client_payload.spec      - the storyboard JSON written by Claude
on:
  repository_dispatch:
    types: [render]
  workflow_dispatch:
    inputs:
      example:
        description: "Example storyboard to test (file name in examples/)"
        default: "chaos_to_calm.json"

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAGE_ID: ${{ github.event.client_payload.page_id || 'manual-test' }}
      CALLBACK: ${{ github.event.client_payload.callback }}
      SPEC_JSON: ${{ toJSON(github.event.client_payload.spec) }}
      CAPTION: ${{ github.event.client_payload.caption }}
      EXAMPLE: ${{ github.event.inputs.example }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          sudo apt-get install -y -qq espeak-ng > /dev/null
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q playwright==1.48.0 numpy scipy piper-tts kokoro soundfile
          python -m playwright install --with-deps chromium > /dev/null

      - name: Cache voices
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-voices-v2

      - name: Cache Kokoro voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-v1

      - name: Download free voices (Piper, UK English)
        run: |
          mkdir -p voices
          for v in cori:high cori:medium alba:medium alan:medium northern_english_male:medium semaine:medium; do
            dir=${v%%:*}; q=${v##*:}; name=en_GB-$dir-$q
            for ext in onnx onnx.json; do
              [ -f "voices/$name.$ext" ] || curl -sSL -o "voices/$name.$ext" "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_GB/$dir/$q/$name.$ext"
            done
          done
          ls -la voices

      - name: Cache music
        uses: actions/cache@v4
        with:
          path: music/files
          key: music-${{ hashFiles('music/library.json') }}
          restore-keys: music-

      - name: Download free music (BudgetPixel, CC BY 4.0)
        run: python music_lib.py fetch

      - name: Write storyboard
        run: |
          python - <<'EOF'
          import json, os
          if os.environ.get('EXAMPLE') and (os.environ.get('SPEC_JSON') in (None, '', 'null')):
              spec = json.load(open('examples/' + os.environ['EXAMPLE']))
          else:
              spec = json.loads(os.environ['SPEC_JSON'])
              if isinstance(spec, str): spec = json.loads(spec)
          json.dump(spec, open('spec.json', 'w'))
          EOF

      - name: Render
        id: render
        run: python render.py spec.json out || true

      - name: Publish files
        id: pub
        run: |
          python - <<'EOF'
          import json, os, shutil, time
          rep = json.load(open('out/report.json'))
          ok = rep.get('ok')
          dest = f"videos/{time.strftime('%Y%m%d-%H%M%S')}-{os.environ['PAGE_ID'][:8]}"
          if ok:
              os.makedirs(f'pub/{dest}', exist_ok=True)
              for f in set(['video.mp4', 'cover.jpg', 'sheet.jpg', 'report.json'] + (rep.get('files') or [])): shutil.copy(f'out/{f}', f'pub/{dest}/{f}')
              shutil.copy('spec.json', f'pub/{dest}/storyboard.json')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as g:
              g.write(f"ok={'true' if ok else 'false'}\ndest={dest}\n")
          EOF
          [ "$(grep '^ok=' $GITHUB_OUTPUT | tail -1 | cut -d= -f2)" = "true" ] || exit 0
          DEST=$(grep '^dest=' $GITHUB_OUTPUT | tail -1 | cut -d= -f2)
          git config user.name "gwithva-video-engine"
          git config user.email "actions@users.noreply.github.com"
          # 1. The video files go to the "media" branch, which GitHub Pages serves. That branch is rebuilt as ONE commit
          #    every time, so old videos really are deleted (no history piling up). A video is kept 21 days: by then it is
          #    either in Buffer (approved posts are sent within hours) or was rejected.
          rm -rf /tmp/media && mkdir -p /tmp/media
          if git fetch -q --depth=1 origin media 2>/dev/null; then git archive FETCH_HEAD | tar -x -C /tmp/media; else cp -r videos /tmp/media/ 2>/dev/null || true; touch /tmp/media/.nojekyll; fi
          mkdir -p /tmp/media/videos && cp -r pub/$DEST /tmp/media/videos/
          python - <<'EOF'
          import os, shutil, time, datetime
          cut = (datetime.datetime.utcnow() - datetime.timedelta(days=21)).strftime('%Y%m%d')
          for d in os.listdir('/tmp/media/videos'):
              p = f'/tmp/media/videos/{d}'
              keep = set(l.strip() for l in open('keep.txt') if l.strip()) if os.path.exists('keep.txt') else set()
              if d in keep: continue  # still waiting to be posted (scheduled), see keep.txt
              if os.path.isdir(p) and d[:8].isdigit() and d[:8] < cut: shutil.rmtree(p); print('archived (deleted)', d)
          EOF
          (cd /tmp/media && git init -q && git checkout -q --orphan media && git add -A && git -c user.name=gwithva-video-engine -c user.email=actions@users.noreply.github.com commit -qm "Videos live on $(date -u +%F)" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media)
          # 2. main keeps only a small record of each video (storyboard + report). Until Pages is switched to the media
          #    branch (the .pages-from-media file exists), main also keeps the files so links keep working.
          mkdir -p $DEST
          if [ -f .pages-from-media ]; then cp pub/$DEST/storyboard.json pub/$DEST/report.json $DEST/; else cp pub/$DEST/* $DEST/; fi
          git add -A videos && git commit -qm "Video for $PAGE_ID" && git pull -q --rebase && git push -q

      - name: Wait until the video is live
        if: steps.pub.outputs.ok == 'true'
        run: |
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          URL="$BASE/${{ steps.pub.outputs.dest }}/video.mp4"
          echo "BASE=$BASE" >> $GITHUB_ENV
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$URL"); echo "try $i: $code"
            [ "$code" = "200" ] && break; sleep 15
          done

      - name: Report back to Make
        if: always()
        run: |
          python - <<'EOF'
          import json, os, urllib.request
          cb = os.environ.get('CALLBACK')
          rep = {}
          try: rep = json.load(open('out/report.json'))
          except Exception: rep = {'ok': False, 'problems': ['The render did not finish. See the run log.']}
          dest = os.environ.get('DEST', '')
          base = os.environ.get('BASE', '')
          body = {'page_id': os.environ['PAGE_ID'], 'ok': bool(rep.get('ok')), 'run_url': os.environ['RUN_URL'],
                  'problems': ' | '.join(rep.get('problems') or [])[:1800], 'total': rep.get('total')}
          if rep.get('ok') and base:
              for k in ('video', 'cover', 'sheet'):
                  ext = 'mp4' if k == 'video' else 'jpg'
                  body[f'{k}_url'] = f"{base}/{dest}/{k}.{ext}"
              # extra versions from the blocks engine: 4:5 / 1:1 crops, extra hooks, the short cut
              body['extra_urls'] = ' '.join(f"{base}/{dest}/{f}" for f in (rep.get('files') or []) if f != 'video.mp4')
              body['notes'] = ' | '.join(rep.get('notes') or [])[:600]
              body['music_credit'] = rep.get('music_credit', '')
              cap = (os.environ.get('CAPTION') or '').strip()
              if cap: body['caption'] = cap + ('\n\n' + body['music_credit'] if body['music_credit'] else '')
          print(json.dumps(body, indent=2))
          if cb:
              req = urllib.request.Request(cb, data=json.dumps(body).encode(), headers={'Content-Type': 'application/json'})
              print(urllib.request.urlopen(req, timeout=30).status)
          EOF
        env:
          DEST: ${{ steps.pub.outputs.dest }}
